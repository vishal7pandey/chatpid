[project]
name = "chatpid"
version = "0.1.0"
description = "GraphRAG for P&IDs: DEXPI -> knowledge graph -> LangGraph ReAct agent over ContextRAG/VectorRAG/PathRAG/CypherRAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydexpi>=1.2",
    "networkx>=3.3",
    "neo4j>=5.22",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-huggingface>=0.1",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "sentence-transformers>=5.7.0",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatpid"]

[tool.ruff]
# .factory/ holds the factory kit's managed, hash-tracked files (verify.py etc.); never lint or reformat them here.
extend-exclude = [".factory"]

[tool.ruff.lint]
# BLE001 (blind except) is ignored on purpose: every `except Exception` here is a boundary that must turn a failure
# into a result instead of crashing a long run: agent tool wrapper (agent.py), CypherRAG retry/fallback chain
# (cypher_rag.py), per-question/per-node loops in eval.py, semantic_enrichment.py and the benchmark scripts, and
# the HTTP handlers in api.py. Narrowing them would need the exception types of three LLM SDKs plus Neo4j.
ignore = ["BLE001"]
