[project]
name = "chatpid"
version = "0.1.0"
description = "GraphRAG for P&IDs: DEXPI -> knowledge graph -> LangGraph ReAct agent over ContextRAG/VectorRAG/PathRAG/CypherRAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydexpi>=0.1",
    "networkx>=3.3",
    "neo4j>=5.22",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatpid"]
