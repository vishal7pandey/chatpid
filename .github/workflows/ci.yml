# Starter CI for a uv-based Python project. Adapt to your project (e.g. drop ruff if you don't use it).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # pytest lives in the [dev] optional extra here, which a plain `uv sync` skips (CPID-2).
      # uv.lock is committed (CPID-23): fail on a stale lock, then install exactly what it pins.
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
